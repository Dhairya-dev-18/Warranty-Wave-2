spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: warranty-wave
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/warrantywave?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:${MYSQL_USER:warrantywave_app}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  output:
    ansi:
      enabled: always

jwt:
  secret: ${JWT_SECRET:}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    db:
      enabled: true
    probes:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: INFO
    org.springframework.security: INFO

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:warrantywave;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
jwt:
  secret: test-only-signing-secret-that-is-long-enough-123456
